name: Release

on:
  push:
    tags:
      - 'v*.*.*'

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  version-check:
    name: Verify tag matches project version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y

      - name: Update PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compare tag with project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(poetry version --short)"
          echo "tag: $TAG, project version: $VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the version in pyproject.toml ($VERSION). Expected tag v$VERSION."
            exit 1
          fi

  pypi-publish:
    name: Upload release to PyPI
    needs: version-check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hardwario/
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y

      - name: Update PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update Poetry configuration
        run: poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry sync --no-interaction

      - name: Package project
        run: poetry build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-win:
    needs: version-check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zip utility
        run: |
          choco install zip -y

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y

      - name: Update PATH
        run: |
          echo "$HOME/AppData/Roaming/Python/Scripts" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update Poetry configuration
        run: poetry config virtualenvs.create false

      - name: Install deps (incl. PyInstaller)
        run: |
          poetry sync --no-interaction
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE (onefile)
        run: |
          pyinstaller --onefile --name hardwario --copy-metadata hardwario hardwario/__main__.py

      - name: Package ZIP (EXE + jlink worker)
        run: |
          NRFPATH="$(python -c "import pynrfjprog; import os; print(os.path.dirname(pynrfjprog.__file__))")"
          echo "$NRFPATH"
          ls -lha "$NRFPATH"
          cp "$NRFPATH/lib_x64/"*.dll dist/
          cp "$NRFPATH/lib_x64/jlinkarm_nrf_worker.exe" dist/
          ls -lha dist
          zip -j hardwario-win.zip dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hardwario-win-${{ github.ref_name }}.zip
          path: hardwario-win.zip

      - name: Upload asset(s) to release (create if missing)
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv hardwario-win.zip "hardwario-win-$TAG.zip"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes ""
          gh release upload "$TAG" "hardwario-win-$TAG.zip" --clobber
