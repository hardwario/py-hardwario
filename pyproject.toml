[project]
name = "hardwario"
version = "1.7.1"
description = "HARDWARIO Command Line Tool"
authors = [
    { name = "Karel Blavka", email = "karel.blavka@hardwario.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Environment :: Console",
]
dependencies = [
    "click (>=8.4.2,<9.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pynrfjprog (>=10.24.2,<11.0.0)",
    "paho-mqtt (>=2.1.0,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "rttt (>=1.9.2,<2.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "urllib3 (>=2.7.0,<3.0.0)",
    "certifi (>=2026.7.22,<2027.0.0)",
    "tomli-w (>=1.2.0,<2.0.0)",
]

[project.urls]
Homepage = "https://github.com/hardwario/py-hardwario"
Repository = "https://github.com/hardwario/py-hardwario"

[project.scripts]
hardwario = "hardwario.cli:main"

[tool.poetry]
packages = [
    { include = "hardwario" },
]

[tool.poetry.group.dev.dependencies]
pycodestyle = "^2.14.0"
pyflakes = "^3.4.0"
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
